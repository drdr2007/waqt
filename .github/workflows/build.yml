name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q waqt-android.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build signed release APK
        run: gradle -p waqt-android --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: waqt-apk
          path: waqt-android/app/build/outputs/apk/release/app-release.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Waqt latest APK
          body: "Download app-release.apk, open it on your phone and allow install from this source."
          files: waqt-android/app/build/outputs/apk/release/app-release.apk
