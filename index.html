}
*{box-sizing:border-box}

button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}

.grow{flex:1;min-width:0}

.day.sel{outline:2px solid var(--accent-text);outline-offset:-2px}
.day.blank{background:none}
.conv-res{font-family:var(--font-display);font-size:22px;text-align:center;padding:10px 4px 2px}
.conv-res small{display:block;font-family:var(--font-body);font-size:13px;color:var(--muted)}
.fields{display:flex;gap:8px;flex-wrap:wrap;padding:6px 16px 12px}

.dial{width:min(100%,320px);height:auto}
.big{font-family:var(--font-display);font-size:34px;font-weight:600;line-height:1}
.aligned{color:var(--good);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent-text)}

.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}

@media (max-width:380px){.hero-name{font-size:28px}.prow{padding:12px}}
body{margin:0}
html{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}

var HM_AR=['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];

/* ---------- time zones ---------- */
function tzOff(tz,utcMs){
  try{
    var p={},parts=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}).formatToParts(new Date(utcMs));
    parts.forEach(function(x){p[x.type]=x.value});
    return (Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute,+p.second)-Math.floor(utcMs/1000)*1000)/3600000;
  }catch(e){ return -new Date(utcMs).getTimezoneOffset()/60; }
}
function civil(tz,ms){
  try{
    var p={},parts=new Intl.DateTimeFormat('en-US',{timeZone:tz,year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date(ms));
    parts.forEach(function(x){p[x.type]=x.value});
    return {y:+p.year,m:+p.month,d:+p.day};
  }catch(e){ var d=new Date(ms); return {y:d.getFullYear(),m:d.getMonth()+1,d:d.getDate()}; }
}
function deviceTz(){ try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'}catch(e){return 'UTC'} }
function getLoc(){
  if(S.useCustom){ var c=S.custom; return {name:c.name||L('موقع مخصص','Custom location'),lat:+c.lat,lng:+c.lng,tz:c.tz||deviceTz()}; }
  var c2=CITIES.find(function(c){return c[0]===S.cityId})||CITIES[2];
  return {name:S.lang==='ar'?c2[1]:c2[2],lat:c2[3],lng:c2[4],tz:c2[5]};
}

/* ---------- prayer time engine ---------- */
function julian(y,m,d){ if(m<=2){y-=1;m+=12} var A=Math.floor(y/100),B=2-A+Math.floor(A/4); return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5; }
function sunPos(jd){
  var D=jd-2451545.0,g=fixA(357.529+0.98560028*D),q=fixA(280.459+0.98564736*D),Lm=fixA(q+1.915*sin(g)+0.020*sin(2*g)),e=23.439-0.00000036*D;
  var RA=atan2(cos(e)*sin(Lm),cos(Lm))/15; return {decl:asin(sin(e)*sin(Lm)),eqt:q/15-fixH(RA)};
}
function calc(y,m,d,loc,tzH,ramadan){
  var meth=METHODS[S.method]||METHODS.mwl, lat=loc.lat, lng=loc.lng;
  var fa=S.method==='custom'?S.cFajr:meth.fajr, ish=S.method==='custom'?S.cIsha:meth.isha;
  var jd0=julian(y,m,d)-lng/(15*24);
  function midDay(t){return fixH(12-sunPos(jd0+t).eqt)}
  function angleTime(a,t,dir){
    var dec=sunPos(jd0+t).decl, noon=midDay(t);
    var v=(-sin(a)-sin(dec)*sin(lat))/(cos(dec)*cos(lat)); if(v>1||v<-1) return NaN;
    var x=acos(v)/15; return noon+(dir==='ccw'?-x:x);
  }
  function asrTime(f,t){ var dec=sunPos(jd0+t).decl; return angleTime(-acot(f+tan(Math.abs(lat-dec))),t); }
  var t={fajr:5,sunrise:6,dhuhr:12,asr:13,sunset:18,maghrib:18,isha:18};
  for(var i=0;i<2;i++){
    var f=function(k){return t[k]/24};
    var nt={
      fajr:angleTime(fa,f('fajr'),'ccw'), sunrise:angleTime(0.833,f('sunrise'),'ccw'),
      dhuhr:midDay(f('dhuhr')), asr:asrTime(S.asr,f('asr')),
      sunset:angleTime(0.833,f('sunset')), maghrib:angleTime(meth.maghrib!=null?meth.maghrib:0.833,f('maghrib')),
      isha:angleTime(typeof ish==='number'?ish:0.833,f('isha'))
    };
    Object.keys(nt).forEach(function(k){ if(!isNaN(nt[k])) t[k]=nt[k]; else if(i===1) t[k]=NaN; });
  }
  var shift=tzH-lng/15; Object.keys(t).forEach(function(k){t[k]+=shift});
  /* higher latitudes */
  if(S.hl!=='none'){
    var night=fixH(t.sunrise-t.sunset+0); if(isNaN(night)) night=NaN;
    var portion=function(a){return S.hl==='mid'?0.5:S.hl==='seventh'?1/7:a/60};
    var fN=isNaN(t.fajr)||(t.sunrise-t.fajr>portion(fa)*night);
    if(fN&&!isNaN(night)) t.fajr=t.sunrise-portion(fa)*night;
    if(typeof ish==='number'){ var iN=isNaN(t.isha)||(t.isha-t.sunset>portion(ish)*night); if(iN&&!isNaN(night)) t.isha=t.sunset+portion(ish)*night; }
  }
  if(typeof ish==='string'){ t.isha=t.maghrib+(ramadan&&S.method==='makkah'?120:+ish)/60; }
  var out={};
  PR.forEach(function(k){ var v=k==='maghrib'?t.maghrib:t[k]; out[k]=isNaN(v)?NaN:((k==='sunrise'||k==='dhuhr')?Math.round(v*60):Math.floor(v*60+1e-6))+(S.adj[k]||0); });
  return out;
}

/* ---------- hijri ---------- */
var fmtH={};
function intlH(cal,y,m,d){
  try{
    if(!fmtH[cal]) fmtH[cal]=new Intl.DateTimeFormat('en-u-ca-'+cal+'-nu-latn',{timeZone:'UTC',day:'numeric',month:'numeric',year:'numeric'});
    var p={}; fmtH[cal].formatToParts(new Date(Date.UTC(y,m-1,d,12))).forEach(function(x){p[x.type]=x.value});
    var r={y:parseInt(p.year,10),m:parseInt(p.month,10),d:parseInt(p.day,10)}; return (r.y>0&&r.m>0&&r.d>0)?r:null;
  }catch(e){return null}
}
function civilFallback(y,m,d){
  var jd=Math.floor(julian(y,m,d)+0.5), l=jd-1948440+10632, nn=Math.floor((l-1)/10631); l=l-10631*nn+354;
  var j=(Math.floor((10985-l)/5316))*(Math.floor((50*l)/17719))+(Math.floor(l/5670))*(Math.floor((43*l)/15238));
  l=l-(Math.floor((30-j)/15))*(Math.floor((17719*j)/50))-(Math.floor(j/16))*(Math.floor((15238*j)/43))+29;
  var mo=Math.floor((24*l)/709); return {y:30*nn+j-30,m:mo,d:l-Math.floor((709*mo)/24)};
}
function hijriFor(y,m,d,noAdj){
  var dt=new Date(Date.UTC(y,m-1,d+(noAdj?0:S.hijriAdj),12));
  var yy=dt.getUTCFullYear(),mm=dt.getUTCMonth()+1,dd=dt.getUTCDate();
  var r=intlH(S.hijriMode==='civil'?'islamic-civil':'islamic-umalqura',yy,mm,dd);
  return r||civilFallback(yy,mm,dd);
}
function hijriToGreg(hy,hm,hd){
  var jd=hd+Math.ceil(29.5*(hm-1))+(hy-1)*354+Math.floor((3+11*hy)/30)+1948439.5-1;
  var base=new Date((jd-2440587.5)*86400000);
  for(var k=-5;k<=5;k++){
    var dt=new Date(Date.UTC(base.getUTCFullYear(),base.getUTCMonth(),base.getUTCDate()+k,12));
    var h=hijriFor(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate());
    if(h.y===hy&&h.m===hm&&h.d===hd) return {y:dt.getUTCFullYear(),m:dt.getUTCMonth()+1,d:dt.getUTCDate()};
  }
  return null;
}

/* ---------- day + schedule ---------- */
var dayCache={};
function dayInfo(off){
  var loc=getLoc(), c=civil(loc.tz,Date.now()), ck=c.y+'-'+c.m+'-'+c.d+'|'+off;
  if(dayCache[ck]) return dayCache[ck];
  var b=new Date(Date.UTC(c.y,c.m-1,c.d+off)), y=b.getUTCFullYear(), m=b.getUTCMonth()+1, d=b.getUTCDate();
  var tzH=tzOff(loc.tz,Date.UTC(y,m-1,d,9)), h=hijriFor(y,m,d);
  var mins=calc(y,m,d,loc,tzH,h.m===9), ms={};
  PR.forEach(function(k){ ms[k]=isNaN(mins[k])?NaN:Date.UTC(y,m-1,d)+(mins[k]/60-tzH)*3600000; });
  return (dayCache[ck]={y:y,m:m,d:d,h:h,mins:mins,ms:ms,key:y+'-'+m+'-'+d,ramadan:h.m===9,tzH:tzH});
}
function schedule(){
  var now=Date.now(), y=dayInfo(-1), t=dayInfo(0), tm=dayInfo(1), seq=[];
  [y,t,tm].forEach(function(di){ ['fajr','dhuhr','asr','maghrib','isha'].forEach(function(k){ if(!isNaN(di.ms[k])) seq.push({key:k,ms:di.ms[k],day:di.key}); }); });
  var next=null,prev=null; for(var i=0;i<seq.length;i++){ if(seq[i].ms>now){next=seq[i];prev=seq[i-1]||null;break;} }
  return {now:now,yest:y,today:t,tom:tm,next:next,prev:prev};
}

/* ---------- qibla ---------- */
function qiblaBearing(lat,lng){
  var dl=(KAABA.lng-lng)*rad, p1=lat*rad, p2=KAABA.lat*rad;
  return fixA(Math.atan2(Math.sin(dl),Math.cos(p1)*Math.tan(p2)-Math.sin(p1)*Math.cos(dl))/rad);
}
function distKm(lat,lng){
  var dp=(KAABA.lat-lat)*rad, dl=(KAABA.lng-lng)*rad, a=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(lat*rad)*Math.cos(KAABA.lat*rad)*Math.sin(dl/2)*Math.sin(dl/2);
  return 6371*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* ---------- formatting ---------- */
function fmtMin(mi){
  if(isNaN(mi)) return '--:--';
  mi=((Math.round(mi)%1440)+1440)%1440; var h=Math.floor(mi/60),m=mi%60;
  if(S.h24) return n(pad(h)+':'+pad(m));
  var pm=h>=12; h=h%12||12; return n(h+':'+pad(m))+' '+L(pm?'م':'ص',pm?'PM':'AM');
}
function fmtDur(ms){ ms=Math.max(0,ms); var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60); s=s%60; return n(pad(h)+':'+pad(m)+':'+pad(s)); }
function fmtClockNow(){ var loc=getLoc(), now=Date.now(), off=tzOff(loc.tz,now), mi=Math.floor(((now/3600000+off)%24)*60); return mi; }
function nowSec(){ var loc=getLoc(), now=Date.now(), off=tzOff(loc.tz,now); var s=Math.floor(((now/1000+off*3600)%86400+86400)%86400); return s; }

function drawDial(){
  var el=document.getElementById('dial'); if(!el) return;
  var loc=getLoc(), b=qiblaBearing(loc.lat,loc.lng), h=V.heading, delta=((b-h+540)%360)-180, ok=Math.abs(delta)<3;
  var ticks='',lab='';
  for(var a=0;a<360;a+=10){ var big=a%90===0, r1=big?120:128, r2=136; var x1=150+r1*Math.sin(a*rad),y1=150-r1*Math.cos(a*rad),x2=150+r2*Math.sin(a*rad),y2=150-r2*Math.cos(a*rad);
    ticks+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="var(--muted)" stroke-width="'+(big?2:1)+'"/>'; }
  [['N',0],['E',90],['S',180],['W',270]].forEach(function(p){ var a=p[1],x=150+104*Math.sin(a*rad),y=150-104*Math.cos(a*rad)+5; lab+='<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="middle" font-size="15" font-weight="600" fill="'+(p[0]==='N'?'var(--bad)':'var(--fg)')+'">'+p[0]+'</text>'; });
  var qx=150+88*Math.sin(b*rad), qy=150-88*Math.cos(b*rad);
  el.innerHTML='<circle cx="150" cy="150" r="142" fill="var(--surface2)" stroke="'+(ok?'var(--good)':'var(--line)')+'" stroke-width="'+(ok?5:2)+'"/>'+
   '<g transform="rotate('+(-h).toFixed(1)+' 150 150)">'+ticks+lab+
   '<g transform="rotate('+b.toFixed(1)+' 150 150)"><path d="M150 36 L162 70 L150 62 L138 70 Z" fill="var(--accent)"/><line x1="150" y1="64" x2="150" y2="150" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/></g>'+
   '<circle cx="'+qx.toFixed(1)+'" cy="'+qy.toFixed(1)+'" r="0" fill="none"/></g>'+
   '<path d="M150 4 L158 22 L142 22 Z" fill="var(--fg)"/><circle cx="150" cy="150" r="6" fill="var(--fg)"/>';
  var m=document.getElementById('dialmsg'); if(m){ m.className=ok?'aligned':'note'; m.style.textAlign='center'; m.textContent=ok?L('أنت متجه نحو القبلة','You are facing the Qibla'):(L('أدر الهاتف ','Turn ')+n(Math.abs(Math.round(delta)))+'° '+(delta>0?L('إلى اليمين','right'):L('إلى اليسار','left'))); }
  var hv=document.getElementById('hdv'); if(hv) hv.textContent=n(Math.round(h))+'°';
}

var actx=null, alarmTimer=null, ringing=null, snoozeUntil=0, vibTimer=null;

}
function tone(f,st,dur,vol,type){
  var o=actx.createOscillator(),g=actx.createGain(); o.type=type||'sine'; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,st); g.gain.linearRampToValueAtTime(vol,st+0.03); g.gain.exponentialRampToValueAtTime(0.0001,st+dur);
  o.connect(g); g.connect(actx.destination); o.start(st); o.stop(st+dur+0.05);
}
var custom={adhan:null,fajr:null,alarm:null}, curAudio=null, previewSlot=null;
function slotOf(name){return (name==='adhan'||name==='fajr'||name==='alarm')?name:null}
function stopSound(){ if(curAudio){ try{curAudio.pause()}catch(e){} curAudio=null; } previewSlot=null; }
function playSound(name,loop){
  var sl=slotOf(name);
  if(sl&&custom[sl]){ stopSound(); var a=new Audio(custom[sl].url); a.volume=Math.max(0,Math.min(1,S.volume/100)); a.loop=!!loop; curAudio=a; a.onended=function(){ if(curAudio===a) curAudio=null; };
    var pr=a.play(); if(pr&&pr.catch) pr.catch(function(){ if(curAudio===a) curAudio=null; }); return; }
  if(sl) name='chime';
  if(!actx||actx.state!=='running') return; var t=actx.currentTime+0.05, v=(S.volume/100)*0.35;
  if(name==='chime'){ tone(523.25,t,1.6,v); tone(659.25,t+0.3,1.6,v); tone(783.99,t+0.6,2.0,v); tone(1046.5,t+0.9,2.2,v*0.8); }
  else if(name==='soft'){ tone(392,t,1.8,v*0.9); tone(587.33,t+0.5,2.2,v*0.8); }
  else { for(var i=0;i<4;i++){ tone(880,t+i*0.35,0.18,v,'square'); } }
}
/* custom audio files, kept in IndexedDB on this device */
function idb(){ return new Promise(function(res,rej){ try{ var r=indexedDB.open('waqt-audio',1); r.onupgradeneeded=function(){ r.result.createObjectStore('f'); }; r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); }; }catch(e){ rej(e); } }); }
function idbOp(mode,fn){ return idb().then(function(db){ return new Promise(function(res,rej){ var t=db.transaction('f',mode), st=t.objectStore('f'), q=fn(st); t.oncomplete=function(){ res(q&&q.result); }; t.onerror=function(){ rej(t.error); }; }); }); }
function setCustom(slot,blob,name){ if(custom[slot]) try{URL.revokeObjectURL(custom[slot].url)}catch(e){} custom[slot]=blob?{url:URL.createObjectURL(blob),name:name}:null; }
function loadCustom(){ ['adhan','fajr','alarm'].forEach(function(sl){ idbOp('readonly',function(st){return st.get(sl)}).then(function(v){ if(v&&v.blob){ setCustom(sl,v.blob,v.name); render(); } }).catch(function(){}); }); }

    return '<div class="row" style="flex-wrap:wrap"><div class="grow"><div class="r-t">'+names[sl]+'</div><div class="r-s">'+(c?esc(c.name):L('لم يتم اختيار ملف','No file chosen'))+'</div></div><div class="btns">'+
     (c?'<button class="btn alt" data-act="prev" data-slot="'+sl+'">'+L('استماع / إيقاف','Play / Stop')+'</button><button class="btn alt" data-act="rmSound" data-slot="'+sl+'">'+L('حذف','Remove')+'</button>':'')+
     '<label class="btn alt" for="snd-'+sl+'">'+L('اختيار ملف','Choose file')+'</label><input id="snd-'+sl+'" type="file" accept="audio/*" hidden data-slot="'+sl+'"></div></div>'; }).join('')+'</section>'+
   '<div class="note">'+L('اختر ملف صوت (mp3 أو m4a أو wav) حتى ١٥ ميجا، مثل تسجيل الأذان الذي تفضله. يُحفظ على هذا الجهاز فقط.','Pick an audio file (mp3, m4a, wav) up to 15 MB, such as the adhan recording you prefer. It is stored on this device only.')+'</div>';

function isQuiet(){
  if(!S.quiet.on) return false; var h=Math.floor(fmtClockNow()/60), a=S.quiet.from, b=S.quiet.to;
  return a<=b?(h>=a&&h<b):(h>=a||h<b);
}
function vibrate(p){ try{ if(S.vibrate&&navigator.vibrate) navigator.vibrate(p); }catch(e){} }
function sysNotify(t,b){ try{ if(window.Notification&&Notification.permission==='granted') new Notification(t,{body:b||''}); }catch(e){} }
function showOverlay(html){ document.getElementById('ov').innerHTML=html; document.getElementById('overlay').classList.add('show'); var b=document.querySelector('#ov [data-act]'); if(b) b.focus(); }
function hideOverlay(){ document.getElementById('overlay').classList.remove('show'); document.getElementById('ov').innerHTML=''; }
function fireAlert(kind,k,at){
  var quiet=isQuiet()||S.silent[k], snd=(k==='fajr'&&S.fajrSound!=='same')?S.fajrSound:S.sound; if(kind==='pre'&&slotOf(snd)) snd='chime'; if(!quiet) playSound(snd); vibrate([300,150,300]);
  var title=kind==='pre'?pname(k)+' '+L('بعد','in')+' '+n(S.pre.min)+' '+L('دقيقة','min'):L('حان وقت صلاة ','It is time for ')+pname(k);
  sysNotify(title,fmtMin(dayInfo(0).mins[k]));
  showOverlay('<h2>'+esc(title)+'</h2><p class="num">'+fmtMin(Math.round(((at/3600000+getDayOffsetH(at))%24)*60))+'</p><div class="btns"><button class="btn" data-act="closeOv">'+(curAudio?L('إيقاف الصوت','Stop sound'):L('حسناً','OK'))+'</button></div>');
}
function getDayOffsetH(ms){ return tzOff(getLoc().tz,ms); }
function startAlarm(key,test){
  if(ringing) return; ringing={key:key,test:!!test};
  var label=S.alarm.target==='sahoor'?L('وقت السحور','Sahoor time'):L('استيقظ! اقترب الفجر','Wake up! Fajr is near'); sysNotify(label,'');
  var tick=function(){ var mi=Math.floor(nowSec()/60); var el=document.getElementById('alclock'); if(el) el.textContent=fmtMin(mi); };
  showOverlay('<h2 class="pulse">'+label+'</h2><p>'+L('الفجر','Fajr')+' <span class="num">'+fmtMin(dayInfo(0).mins.fajr)+'</span></p><div class="clock num" id="alclock"></div><div class="btns"><button class="btn alt" data-act="snooze">'+L('غفوة','Snooze')+' '+n(S.alarm.snooze)+' '+L('د','min')+'</button><button class="btn" data-act="stopAlarm">'+L('إيقاف','Stop')+'</button></div>');
  tick(); var useFile=slotOf(S.alarm.sound)&&custom[S.alarm.sound]; var ring=function(){ if(!useFile) playSound(S.alarm.sound); vibrate([500,250,500,250,500]); tick(); };
  if(useFile) playSound(S.alarm.sound,true); ring(); alarmTimer=setInterval(ring,3500);
}
function endAlarm(){ stopSound(); if(alarmTimer){clearInterval(alarmTimer);alarmTimer=null} ringing=null; try{navigator.vibrate&&navigator.vibrate(0)}catch(e){} hideOverlay(); }
function checkAlerts(sc){
  var now=sc.now;
  [sc.yest,sc.today,sc.tom].forEach(function(di){
    PR.forEach(function(k){
      if(!S.alerts[k]||isNaN(di.ms[k])) return; var at=di.ms[k], id=di.key+k;
      if(now>=at&&now<at+90000&&!fired.has('p'+id)){ fired.add('p'+id); saveFired(); if(!ringing) fireAlert('prayer',k,at); }
      if(S.pre.on&&k!=='sunrise'){ var pa=at-S.pre.min*60000; if(now>=pa&&now<pa+90000&&!fired.has('r'+id)){ fired.add('r'+id); saveFired(); if(!ringing) fireAlert('pre',k,at); } }
    });
  });
  if(S.alarm.on&&!ringing){
    if(snoozeUntil&&now>=snoozeUntil){ snoozeUntil=0; startAlarm('snooze'); return; }
    [sc.today,sc.tom].forEach(function(di){
      var at=di.ms.fajr-S.alarm.before*60000; if(isNaN(at)||ringing) return;
      var dow=new Date(Date.UTC(di.y,di.m-1,di.d,12)).getUTCDay();
      if(S.alarm.days.indexOf(dow)<0) return; if(S.alarm.ramadanOnly&&!di.ramadan) return;
      if(now>=at&&now<at+20*60000&&!dismissed.has(di.key)&&!snoozeUntil) startAlarm(di.key);
    });
  }
}
var wake=null;
function wantWake(){ if(S.keepAwake||S.alarm.on){ try{ if(navigator.wakeLock&&!wake&&document.visibilityState==='visible'){ navigator.wakeLock.request('screen').then(function(l){wake=l;l.addEventListener('release',function(){wake=null})}).catch(function(){}); } }catch(e){} } else if(wake){ try{wake.release()}catch(e){} wake=null; } }

  if(h==null) return; V.hasSensor=true; V.heading=h; var r=document.getElementById('hd'); if(r) r.value=Math.round(h); drawDial();
}

  var go=function(){ window.addEventListener('deviceorientationabsolute',onOrient,true); window.addEventListener('deviceorientation',onOrient,true);
    setTimeout(function(){ if(!V.hasSensor){ V.sensorMsg=L('لم تصل قراءات من الحساس. هذه الصفحة لا تملك صلاحية الحساس، استخدم الشريط يدوياً.','No sensor readings arrived. This page does not have sensor access, so use the slider.'); var m2=document.getElementById('sensormsg'); if(m2) m2.textContent=V.sensorMsg; } },2500); };
  try{ if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){ DeviceOrientationEvent.requestPermission().then(function(r){ if(r==='granted') go(); else { V.sensorMsg=L('تم رفض إذن الحساس.','Sensor permission denied.'); var m3=document.getElementById('sensormsg'); if(m3) m3.textContent=V.sensorMsg; } }).catch(function(){ go(); }); } else go(); }catch(e){ go(); }
}

      (window.claude&&claude.use?claude.use('downloads'):Promise.resolve(null)).then(function(d){
        if(!d){ try{ var bl=new Blob([JSON.stringify({app:'waqt',v:1,settings:S},null,1)],{type:'application/json'}),a=document.createElement('a'); a.href=URL.createObjectURL(bl); a.download='waqt-backup.json'; document.body.appendChild(a); a.click(); a.remove(); V.flash=L('تم تجهيز الملف.','File ready.'); }catch(e){ V.flash=L('تعذّر الحفظ. انسخ النص.','Could not save. Copy the text instead.'); } render(); return; }
        return d.save({filename:'waqt-backup.json',data:JSON.stringify({app:'waqt',v:1,settings:S},null,1)}).then(function(){ V.flash=L('تم الحفظ.','Saved.'); render(); }).catch(function(er){ V.flash=(er&&er.code==='declined')?L('أُلغي الحفظ.','Save cancelled.'):L('تعذّر الحفظ. انسخ النص.','Could not save. Copy the text instead.'); render(); });
      }).catch(function(){ V.flash=L('تعذّر الحفظ.','Could not save.'); render(); }); break;
    case 'copyBackup': copyText(JSON.stringify({app:'waqt',v:1,settings:S},null,1),L('تم النسخ.','Copied.')); break;
    case 'importText': var ta=document.getElementById('bk-in'); V.importText=ta?ta.value:''; doImport(V.importText); break;
    case 'askReset': V.confirmReset=true; render(); break;
    case 'cancelReset': V.confirmReset=false; render(); break;
    case 'reset': S=clone(DEFAULTS); V.confirmReset=false; save(); applyLook(); initView(); V.flash=L('أُعيدت الإعدادات الافتراضية.','Defaults restored.'); render(); break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.type==='file'&&t.dataset&&t.dataset.slot){ var f=t.files&&t.files[0], sl=t.dataset.slot; if(!f) return;
    if(f.size>15*1024*1024){ V.flash=L('الملف أكبر من ١٥ ميجا.','That file is larger than 15 MB.'); alert15(); return; }
    setCustom(sl,f,f.name); render();
    idbOp('readwrite',function(st){return st.put({blob:f,name:f.name},sl)}).catch(function(){ var m=document.getElementById('sndwarn'); if(m) m.textContent=L('لن يُحفظ الملف بعد إغلاق الصفحة.','The file will not be kept after you close the page.'); });
    return; }
  if(t.id==='bk-file'&&t.files&&t.files[0]){ var fr=new FileReader(); fr.onload=function(){ doImport(String(fr.result)); }; fr.readAsText(t.files[0]); return; }
  if(t.dataset&&t.dataset.conv){ var k=t.dataset.conv, v=parseInt(t.value,10); if(!isNaN(v)){ V.conv[k]=v; V.conv.res=null; } return; }
  var p=t.getAttribute&&t.getAttribute('data-set'); if(!p) return;
  var ty=t.getAttribute('data-type'), v2=t.value;
  if(ty==='num'){ v2=parseFloat(v2); if(isNaN(v2)) return; var mn=t.getAttribute('data-min'), mx=t.getAttribute('data-max'); if(mn!==null&&v2<+mn) v2=+mn; if(mx!==null&&v2>+mx) v2=+mx; }
  if(p==='useCustom') return; setP(p,v2); wantWake();
});
document.addEventListener('input',function(e){
  if(e.target.id==='hd'){ V.heading=+e.target.value; drawDial(); }
});
function alert15(){ var m=document.getElementById('sndwarn'); if(m) m.textContent=V.flash; }
function convert(){
  var cv=V.conv;
  if(cv.mode==='g'){
    var dt=new Date(Date.UTC(cv.gy,cv.gm-1,cv.gd,12)); if(dt.getUTCMonth()!==cv.gm-1||cv.gy<1900||cv.gy>2100){ cv.res=L('تاريخ غير صالح','Invalid date'); render(); return; }
    var h=hijriFor(cv.gy,cv.gm,cv.gd); cv.res=n(h.d)+' '+esc(hmName(h.m))+' '+n(h.y)+L(' هـ',' AH')+'<small>'+esc(gWeekday(cv.gy,cv.gm,cv.gd))+'</small>';
  } else {
    var g=(cv.hy>=1318&&cv.hy<=1500)?hijriToGreg(cv.hy,cv.hm,cv.hd):null;
    cv.res=g?(n(g.d)+' '+esc(gMonth(g.y,g.m))+' '+n(g.y)+'<small>'+esc(gWeekday(g.y,g.m,g.d))+'</small>'):L('تاريخ غير صالح','Invalid date');
  }
  render();
}

/* ---------- main loop ---------- */
function tick(){
  var sc=schedule(); var k=sc.today.key+'|'+(sc.next?sc.next.key+sc.next.day:'');
  if(k!==lastKey&&V.tab==='prayers'&&!ringing&&document.activeElement===document.body) render(); else { lastKey=k; if(V.tab==='prayers') updateLive(sc); }
  checkAlerts(sc);
}
load(); loadFired(); applyLook(); initView(); render(); loadCustom();
setInterval(tick,1000);
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'){ wantWake(); tick(); } });
wantWake();
})();
</script>
